name: Bug 反馈
description: 报告一个问题（控速失效、崩溃、温度读数异常等）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。**下面带 `*` 的字段请务必填写**——控速依赖 SMC 私有接口，
        不同机型差异极大，缺了机型和日志基本无法定位问题。

        在提交之前，可以先看一眼 [故障排查文档](https://github.com/nzleo/LeoMacFanControl/blob/main/docs/troubleshooting.md)，
        常见情况（面板一直显示"仅监控"、Gatekeeper 拦截等）那里都有解法。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 你做了什么、期望发生什么、实际发生了什么。
      placeholder: |
        例：切到"目标温度"模式设 75°C，但风扇转速一直停在 1000 RPM 不变，
        温度已经到 85°C 了。期望风扇应该升速。
    validations:
      required: true

  - type: input
    id: mac-model
    attributes:
      label: Mac 机型
      description: |
        终端执行 `sysctl -n hw.model` 拿到型号标识符，例如 `Mac16,10`。
        也请一并写上你知道的商品名（例如 "Mac mini 2024"）。
      placeholder: "Mac16,10（Mac mini 2024）"
    validations:
      required: true

  - type: input
    id: chip
    attributes:
      label: 芯片
      description: 例如 M4、M1 Pro、Intel Core i7（2019 款）。
      placeholder: "M4（10 核）"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS 版本
      description: 终端执行 `sw_vers -productVersion`，或看 关于本机。
      placeholder: "15.7"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App 版本
      description: |
        菜单栏面板里显示的版本号。如果不确定，写下载的 DMG 文件名也可以。
      placeholder: "1.3"
    validations:
      required: true

  - type: textarea
    id: panel-status
    attributes:
      label: 面板上显示的状态文字
      description: |
        请照抄面板右上角的状态（例如"守护进程运行中" / "仅监控（未控速）"），
        以及面板底部如果有失败原因提示，也请一并抄下来——**那行文字通常直接指出原因**。
      placeholder: |
        右上角：守护进程运行中
        底部提示：系统拒绝进入手动模式（Ftst 解锁也未生效），16s 后重试
    validations:
      required: true

  - type: textarea
    id: daemon-log
    attributes:
      label: 守护进程日志
      description: |
        终端执行下面这条命令，把输出粘进来（会要求输入登录密码）：

        ```
        sudo tail -50 /Library/Logs/LeoFanControl/fanhelperd.log
        ```

        如果提示文件不存在，说明守护进程没装成功，请照实说明。
      render: text
    validations:
      required: true

  - type: textarea
    id: daemon-status
    attributes:
      label: 守护进程上报的状态（可选，但很有帮助）
      description: |
        需要你的账号在 admin 组。终端执行：

        ```
        printf '{"command":"getStatus"}\n' | nc -U /var/run/com.leo.fancontrol.sock
        ```

        这条输出里包含风扇 RPM 范围、传感器读数、走的是哪条控制通道，
        对定位问题非常有用。
      render: json
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 其他信息（可选）
      description: 截图、复现步骤、你已经试过的办法等。
    validations:
      required: false
